services:
  - type: web
    name: cbc-school-management
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: CBC School Management System
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: ASSET_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: APP_TIMEZONE
        value: Africa/Nairobi
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: CACHE_STORE
        value: array
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_COOKIE
        value: cbc_session
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: QUEUE_CONNECTION
        value: database
      - key: QUEUE_WORKER
        value: "true"
      - key: QUEUE_REPORTS_WORKER
        value: "true"
      - key: USE_REDIS
        value: "false"
      - key: REDIS_CLIENT
        value: predis
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_MIGRATION_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: DB_CONNECT_TIMEOUT
        value: "10"
      - key: MIGRATION_TIMEOUT
        value: "120"
